<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Fretboard</title>
<style>
  :root {
    --bg: #131519;
    --panel: #1c1f25;
    --panel-2: #23272e;
    --border: #2e333c;
    --text: #e8eaee;
    --muted: #98a0ac;
    --accent: #f0b429;

    --wood-1: #4a3324;
    --wood-2: #33231a;
    --fret: #c4c9d0;
    --nut: #ece6d6;
    --string: #d9d3c6;
    --inlay: #e8e0cc;

    --c-root: #e5484d;
    --c-third: #3b8eea;
    --c-fifth: #3fb565;
    --c-seventh: #a86fe8;
    --c-ext: #ef9a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1500px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; margin: 0 0 14px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  select:hover, button:hover { border-color: #4a515d; }
  select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select.big { font-size: 16px; font-weight: 600; min-width: 80px; }

  .seg { display: inline-flex; }
  .seg button { border-radius: 0; min-width: 40px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .seg button.on { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }

  .check { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; padding-bottom: 7px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }

  .chordinfo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
  #symbol { font-size: 28px; font-weight: 700; min-width: 90px; }
  #symbol small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  #legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 6px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .chip .dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 12px; color: #fff;
  }
  .chip .iv { color: var(--muted); font-size: 12px; }
  .chip.off { opacity: .4; }
  .chip.off .dot { background: transparent !important; border: 2px dashed var(--muted); color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; }

  .board-wrap { padding: 10px 6px; }
  .scroll { overflow-x: auto; }
  #board { display: block; width: 100%; min-width: 900px; height: auto; }
  #board text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }

  .tune-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .tune-head h2 { margin: 0; }
  .tune-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #tuneRows { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .trow {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .trow .num { color: var(--muted); font-size: 12px; width: 58px; }
  .trow .note { font-weight: 700; font-size: 16px; width: 44px; text-align: center; }
  .trow .note sub { font-size: 10px; color: var(--muted); font-weight: 500; }
  .trow button { padding: 2px 10px; font-size: 16px; line-height: 1.2; }
  .trow.changed .note { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Chord <span>Fretboard</span></h1>

  <section class="panel">
    <div class="controls">
      <div class="field"><span>Root</span><select id="root" class="big"></select></div>
      <div class="field"><span>Chord</span><select id="chord" class="big"></select></div>
      <div class="field"><span>Strings</span>
        <div class="seg" id="strings"><button data-n="6">6</button><button data-n="7">7</button></div>
      </div>
      <div class="field"><span>Tuning</span><select id="preset"></select></div>
      <div class="field"><span>Frets</span><select id="frets"></select></div>
      <div class="field"><span>Labels</span>
        <select id="labels">
          <option value="notes">Note names</option>
          <option value="intervals">Intervals</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="showAll"> Show other notes</label>
    </div>
  </section>

  <section class="panel chordinfo">
    <div id="symbol"></div>
    <div id="legend"></div>
    <div class="hint">Click a note to hide or show it</div>
  </section>

  <section class="panel board-wrap">
    <div class="scroll"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </section>

  <section class="panel">
    <div class="tune-head">
      <h2>Tuning: <span id="tuneName" style="color:var(--text)"></span></h2>
      <div class="tune-actions">
        <button id="allDown" title="Tune every string down a half step">All strings −½</button>
        <button id="allUp" title="Tune every string up a half step">All strings +½</button>
        <button id="dropLow" title="Lower only the lowest string by a whole step">Drop lowest string</button>
      </div>
    </div>
    <div id="tuneRows"></div>
  </section>
</main>

<script>
// ---------- Music data ----------
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
// Names used for tunings and "other notes"
const PC_NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

// [display name, letter index, accidental]
const ROOTS = [
  ['C', 0, 0], ['C♯', 0, 1], ['D♭', 1, -1], ['D', 1, 0], ['D♯', 1, 1], ['E♭', 2, -1],
  ['E', 2, 0], ['F', 3, 0], ['F♯', 3, 1], ['G♭', 4, -1], ['G', 4, 0], ['G♯', 4, 1],
  ['A♭', 5, -1], ['A', 5, 0], ['A♯', 5, 1], ['B♭', 6, -1], ['B', 6, 0],
];

// Intervals as [semitones, degree label]
const CHORDS = [
  { id: 'maj',   name: 'major',            sym: '',       iv: [[0,'1'],[4,'3'],[7,'5']] },
  { id: 'min',   name: 'minor',            sym: 'm',      iv: [[0,'1'],[3,'♭3'],[7,'5']] },
  { id: '5',     name: 'power chord',      sym: '5',      iv: [[0,'1'],[7,'5']] },
  { id: 'dim',   name: 'diminished',       sym: 'dim',    iv: [[0,'1'],[3,'♭3'],[6,'♭5']] },
  { id: 'aug',   name: 'augmented',        sym: 'aug',    iv: [[0,'1'],[4,'3'],[8,'♯5']] },
  { id: 'sus2',  name: 'suspended 2nd',    sym: 'sus2',   iv: [[0,'1'],[2,'2'],[7,'5']] },
  { id: 'sus4',  name: 'suspended 4th',    sym: 'sus4',   iv: [[0,'1'],[5,'4'],[7,'5']] },
  { id: '6',     name: 'major 6th',        sym: '6',      iv: [[0,'1'],[4,'3'],[7,'5'],[9,'6']] },
  { id: 'm6',    name: 'minor 6th',        sym: 'm6',     iv: [[0,'1'],[3,'♭3'],[7,'5'],[9,'6']] },
  { id: '7',     name: 'dominant 7th',     sym: '7',      iv: [[0,'1'],[4,'3'],[7,'5'],[10,'♭7']] },
  { id: 'maj7',  name: 'major 7th',        sym: 'maj7',   iv: [[0,'1'],[4,'3'],[7,'5'],[11,'7']] },
  { id: 'm7',    name: 'minor 7th',        sym: 'm7',     iv: [[0,'1'],[3,'♭3'],[7,'5'],[10,'♭7']] },
  { id: 'mmaj7', name: 'minor-major 7th',  sym: 'm(maj7)',iv: [[0,'1'],[3,'♭3'],[7,'5'],[11,'7']] },
  { id: 'm7b5',  name: 'half-diminished',  sym: 'm7♭5',   iv: [[0,'1'],[3,'♭3'],[6,'♭5'],[10,'♭7']] },
  { id: 'dim7',  name: 'diminished 7th',   sym: 'dim7',   iv: [[0,'1'],[3,'♭3'],[6,'♭5'],[9,'♭♭7']] },
  { id: '7sus4', name: 'dominant 7 sus4',  sym: '7sus4',  iv: [[0,'1'],[5,'4'],[7,'5'],[10,'♭7']] },
  { id: 'add9',  name: 'add 9',            sym: 'add9',   iv: [[0,'1'],[4,'3'],[7,'5'],[14,'9']] },
  { id: 'madd9', name: 'minor add 9',      sym: 'm(add9)',iv: [[0,'1'],[3,'♭3'],[7,'5'],[14,'9']] },
  { id: '9',     name: 'dominant 9th',     sym: '9',      iv: [[0,'1'],[4,'3'],[7,'5'],[10,'♭7'],[14,'9']] },
  { id: 'maj9',  name: 'major 9th',        sym: 'maj9',   iv: [[0,'1'],[4,'3'],[7,'5'],[11,'7'],[14,'9']] },
  { id: 'm9',    name: 'minor 9th',        sym: 'm9',     iv: [[0,'1'],[3,'♭3'],[7,'5'],[10,'♭7'],[14,'9']] },
];

const BASE6 = [40, 45, 50, 55, 59, 64];        // E2 A2 D3 G3 B3 E4
const BASE7 = [35, ...BASE6];                  // B1 + standard
const FRET_OPTIONS = [12, 15, 17, 21, 22, 24];
const INLAYS = [3, 5, 7, 9, 15, 17, 19, 21];
const DOUBLE_INLAYS = [12, 24];

const pc = m => ((m % 12) + 12) % 12;
const octave = m => Math.floor(m / 12) - 1;
const accStr = a => ({ '-2': '♭♭', '-1': '♭', '0': '', '1': '♯', '2': '♯♯' })[a];

function degreeOf(label) { return parseInt(label.replace(/\D/g, ''), 10); }

function category(label) {
  const d = degreeOf(label);
  if (d === 1) return 'root';
  if (d >= 2 && d <= 4) return 'third';
  if (d === 5) return 'fifth';
  if (d === 6 || d === 7) return 'seventh';
  return 'ext';
}

// Spell each chord tone with the right letter (e.g. A♭ major = A♭ C E♭)
function chordTones(rootIdx, chordId) {
  const [, rootLetter, rootAcc] = ROOTS[rootIdx];
  const rootPc = pc(LETTER_PC[rootLetter] + rootAcc);
  const chord = CHORDS.find(c => c.id === chordId);
  return chord.iv.map(([semis, label]) => {
    const letter = (rootLetter + degreeOf(label) - 1) % 7;
    const notePc = pc(rootPc + semis);
    const acc = pc(notePc - LETTER_PC[letter] + 6) - 6;
    return { pc: notePc, label, name: LETTERS[letter] + accStr(acc), cat: category(label) };
  });
}

function presets(n) {
  const base = n === 7 ? BASE7 : BASE6;
  const list = [];
  for (let off = 0; off >= -5; off--) {
    const std = base.map(m => m + off);
    list.push({ name: PC_NAMES[pc(std[0])] + ' Standard', t: std });
    const drop = [std[0] - 2, ...std.slice(1)];
    list.push({ name: 'Drop ' + PC_NAMES[pc(drop[0])], t: drop });
  }
  if (n === 6) {
    list.push(
      { name: 'DADGAD', t: [38, 45, 50, 55, 57, 62] },
      { name: 'Open G', t: [38, 43, 50, 55, 59, 62] },
      { name: 'Open D', t: [38, 45, 50, 54, 57, 62] },
    );
  }
  return list;
}

function matchPreset(tuning) {
  return presets(tuning.length).findIndex(p => p.t.every((m, i) => m === tuning[i]));
}

// ---------- State ----------
const STORE_KEY = 'chord-fretboard-v1';
function defaults() {
  return {
    strings: 6, tuning: [...BASE6],
    root: ROOTS.findIndex(r => r[0] === 'A'), chord: 'min',
    frets: 22, labels: 'notes', showAll: false, hidden: [],
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.tuning) && s.tuning.length === s.strings) return { ...defaults(), ...s };
  } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
const state = load();

// ---------- Controls ----------
const $ = id => document.getElementById(id);

$('root').innerHTML = ROOTS.map((r, i) => `<option value="${i}">${r[0]}</option>`).join('');
$('chord').innerHTML = CHORDS.map(c => `<option value="${c.id}">${c.sym || 'maj'} — ${c.name}</option>`).join('');
$('frets').innerHTML = FRET_OPTIONS.map(f => `<option value="${f}">${f}</option>`).join('');

$('root').addEventListener('change', e => { state.root = +e.target.value; render(); });
$('chord').addEventListener('change', e => { state.chord = e.target.value; state.hidden = []; render(); });
$('frets').addEventListener('change', e => { state.frets = +e.target.value; render(); });
$('labels').addEventListener('change', e => { state.labels = e.target.value; render(); });
$('showAll').addEventListener('change', e => { state.showAll = e.target.checked; render(); });

$('preset').addEventListener('change', e => {
  if (e.target.value === 'custom') return;
  state.tuning = [...presets(state.strings)[+e.target.value].t];
  render();
});

$('strings').addEventListener('click', e => {
  const n = +e.target.dataset.n;
  if (!n || n === state.strings) return;
  const idx = matchPreset(state.tuning);
  const target = presets(n);
  if (idx >= 0 && idx < 12) {
    // Map Standard/Drop presets across (E Standard <-> B Standard, Drop D <-> Drop A, ...)
    state.tuning = [...target[idx].t];
  } else if (n === 7) {
    state.tuning = [state.tuning[0] - 5, ...state.tuning];
  } else {
    state.tuning = state.tuning.slice(1);
  }
  state.strings = n;
  render();
});

function clampMidi(m) { return Math.max(16, Math.min(84, m)); }
$('allDown').addEventListener('click', () => { state.tuning = state.tuning.map(m => clampMidi(m - 1)); render(); });
$('allUp').addEventListener('click', () => { state.tuning = state.tuning.map(m => clampMidi(m + 1)); render(); });
$('dropLow').addEventListener('click', () => { state.tuning[0] = clampMidi(state.tuning[0] - 2); render(); });

$('tuneRows').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]');
  if (!b) return;
  const s = +b.dataset.s;
  state.tuning[s] = clampMidi(state.tuning[s] + +b.dataset.d);
  render();
});

$('legend').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const label = chip.dataset.label;
  state.hidden = state.hidden.includes(label)
    ? state.hidden.filter(l => l !== label)
    : [...state.hidden, label];
  render();
});

// ---------- Render ----------
function render() {
  const tones = chordTones(state.root, state.chord);
  const chord = CHORDS.find(c => c.id === state.chord);
  const rootName = ROOTS[state.root][0];

  $('root').value = state.root;
  $('chord').value = state.chord;
  $('frets').value = state.frets;
  $('labels').value = state.labels;
  $('showAll').checked = state.showAll;
  [...$('strings').children].forEach(b => b.classList.toggle('on', +b.dataset.n === state.strings));

  // Tuning preset dropdown
  const list = presets(state.strings);
  const match = matchPreset(state.tuning);
  $('preset').innerHTML =
    list.map((p, i) => `<option value="${i}">${p.name}</option>`).join('') +
    (match < 0 ? `<option value="custom">Custom</option>` : '');
  $('preset').value = match < 0 ? 'custom' : String(match);
  const lowToHigh = state.tuning.map(m => PC_NAMES[pc(m)]).join(' ');
  $('tuneName').textContent = (match < 0 ? 'Custom' : list[match].name) + '  (' + lowToHigh + ')';

  // Chord header + legend
  $('symbol').innerHTML = `${rootName}${chord.sym}<small>${rootName} ${chord.name}</small>`;
  $('legend').innerHTML = tones.map(t => `
    <button class="chip ${state.hidden.includes(t.label) ? 'off' : ''}" data-label="${t.label}"
            title="${state.hidden.includes(t.label) ? 'Show' : 'Hide'} ${t.name}">
      <span class="dot" style="background:var(--c-${t.cat})">${t.label}</span>
      <span>${t.name}</span>
    </button>`).join('');

  // Tuning editor (highest string first, matching the fretboard)
  const ref = presets(state.strings)[0].t;
  const n = state.strings;
  let rows = '';
  for (let i = 0; i < n; i++) {
    const s = n - 1 - i;
    const m = state.tuning[s];
    rows += `
      <div class="trow ${match !== 0 && m !== ref[s] ? 'changed' : ''}">
        <span class="num">String ${i + 1}</span>
        <button data-s="${s}" data-d="-1" aria-label="Tune string ${i + 1} down">−</button>
        <span class="note">${PC_NAMES[pc(m)]}<sub>${octave(m)}</sub></span>
        <button data-s="${s}" data-d="1" aria-label="Tune string ${i + 1} up">+</button>
      </div>`;
  }
  $('tuneRows').innerHTML = rows;

  renderBoard(tones);
  save();
}

function renderBoard(tones) {
  const n = state.strings, F = state.frets;
  const labelW = 40, openW = 54, gap = 38, firstY = 34;
  const nutX = labelW + openW;

  // Frets get gradually narrower, like a real neck (but not as extreme)
  const fretX = [nutX];
  for (let f = 1; f <= F; f++) fretX.push(fretX[f - 1] + 80 * Math.pow(0.962, f - 1));
  const endX = fretX[F];
  const boardTop = firstY - gap / 2;
  const boardBot = firstY + (n - 1) * gap + gap / 2;
  const W = endX + 14;
  const H = boardBot + 34;
  const rowY = i => firstY + i * gap;
  const cellX = f => f === 0 ? labelW + openW / 2 - 4 : (fretX[f - 1] + fretX[f]) / 2;

  const byPc = new Map(tones.filter(t => !state.hidden.includes(t.label)).map(t => [t.pc, t]));
  const out = [];

  out.push(`<defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--wood-1)"/><stop offset="1" stop-color="var(--wood-2)"/>
    </linearGradient>
  </defs>`);

  // Board
  out.push(`<rect x="${nutX}" y="${boardTop}" width="${endX - nutX}" height="${boardBot - boardTop}" fill="url(#wood)" rx="3"/>`);

  // Inlays
  const midY = (boardTop + boardBot) / 2;
  const h = boardBot - boardTop;
  for (const f of INLAYS) if (f <= F)
    out.push(`<circle cx="${cellX(f)}" cy="${midY}" r="7" fill="var(--inlay)" opacity=".55"/>`);
  for (const f of DOUBLE_INLAYS) if (f <= F) {
    out.push(`<circle cx="${cellX(f)}" cy="${boardTop + h * 0.3}" r="7" fill="var(--inlay)" opacity=".55"/>`);
    out.push(`<circle cx="${cellX(f)}" cy="${boardTop + h * 0.7}" r="7" fill="var(--inlay)" opacity=".55"/>`);
  }

  // Frets + nut
  for (let f = 1; f <= F; f++)
    out.push(`<line x1="${fretX[f]}" y1="${boardTop}" x2="${fretX[f]}" y2="${boardBot}" stroke="var(--fret)" stroke-width="3"/>`);
  out.push(`<rect x="${nutX - 6}" y="${boardTop - 1}" width="7" height="${boardBot - boardTop + 2}" fill="var(--nut)" rx="1.5"/>`);

  // Strings (row 0 = highest string, at the top)
  for (let i = 0; i < n; i++) {
    const s = n - 1 - i;
    const thick = 1 + (n - 1 - s) * 0.42;
    const y = rowY(i);
    out.push(`<line x1="${labelW + 10}" y1="${y}" x2="${nutX}" y2="${y}" stroke="var(--string)" stroke-width="${thick}" opacity=".35"/>`);
    out.push(`<line x1="${nutX}" y1="${y}" x2="${endX}" y2="${y}" stroke="var(--string)" stroke-width="${thick}"/>`);
    out.push(`<text x="${labelW / 2 - 2}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--muted)">${PC_NAMES[pc(state.tuning[s])]}</text>`);
  }

  // Fret numbers
  for (let f = 0; f <= F; f++) {
    const marked = INLAYS.includes(f) || DOUBLE_INLAYS.includes(f);
    out.push(`<text x="${cellX(f)}" y="${boardBot + 22}" text-anchor="middle" font-size="12"
      font-weight="${marked ? 700 : 400}" fill="${marked ? 'var(--text)' : 'var(--muted)'}">${f === 0 ? 'open' : f}</text>`);
  }

  // Notes
  for (let i = 0; i < n; i++) {
    const s = n - 1 - i;
    const y = rowY(i);
    for (let f = 0; f <= F; f++) {
      const notePc = pc(state.tuning[s] + f);
      const x = cellX(f);
      const t = byPc.get(notePc);
      if (t) {
        const text = state.labels === 'intervals' ? t.label : t.name;
        const fs = text.length > 2 ? 10 : 12;
        out.push(`<g><title>${t.name} (${t.label}) — string ${i + 1}, ${f === 0 ? 'open' : 'fret ' + f}</title>
          <circle cx="${x}" cy="${y}" r="14" fill="var(--c-${t.cat})" stroke="${f === 0 ? '#fff' : 'rgba(0,0,0,.35)'}" stroke-width="${f === 0 ? 2 : 1}"/>
          <text x="${x}" y="${y + fs / 2 - 1}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff">${text}</text></g>`);
      } else if (state.showAll) {
        out.push(`<circle cx="${x}" cy="${y}" r="10" fill="#0e0f12" opacity=".55"/>
          <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" fill="#c9ccd2" opacity=".75">${PC_NAMES[notePc]}</text>`);
      }
    }
  }

  const svg = $('board');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out.join('');
}

render();
</script>
</body>
</html>
